name: Verify fix lint gates
on:
  push:
    branches: [ci/verify-fix-transaction-20261126]
permissions:
  contents: read
concurrency:
  group: review33-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  lint:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4523cf65766d0b256e46df1113d7bbd6a21261a2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - name: Vet
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: |
          export GOENV=off GOCACHEPROG=
          go vet ./... 2>&1 | tee review33-vet.log
      - name: Golangci-lint
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0
          args: ./...
          skip-cache: true
      - name: Self-lint
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: |
          export GOENV=off GOCACHEPROG=
          go run ./cmd/gglint run ./... 2>&1 | tee review33-selflint.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gglint-review33-lint
          path: review33-*.log
          if-no-files-found: error
          retention-days: 7
